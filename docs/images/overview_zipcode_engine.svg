<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .header-bg { fill: #0f172a; }
      .legacy-panel { fill: #fff1f2; stroke: #fda4af; stroke-width: 1.5; }
      .legacy-header { fill: #be123c; }
      .legacy-card { fill: #ffffff; stroke: #f43f5e; stroke-width: 1.2; }
      .engine-panel { fill: #f0f9ff; stroke: #7dd3fc; stroke-width: 1.5; }
      .engine-header { fill: #0369a1; }
      .engine-card { fill: #ffffff; stroke: #0284c7; stroke-width: 1.3; }
      .engine-card-highlight { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
      .output-bar { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; }
      .title { font-family: 'BIZ UDゴシック', 'Meiryo', sans-serif; font-size: 18px; font-weight: bold; fill: #ffffff; }
      .subtitle { font-family: 'BIZ UDゴシック', 'Meiryo', sans-serif; font-size: 12px; fill: #cbd5e1; }
      .panel-title { font-family: 'BIZ UDゴシック', 'Meiryo', sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .card-num { font-family: 'Segoe UI', 'BIZ UDゴシック', sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; }
      .card-title { font-family: 'BIZ UDゴシック', 'Meiryo', sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; }
      .card-text { font-family: 'BIZ UDゴシック', 'Meiryo', sans-serif; font-size: 11px; fill: #334155; }
      .warn-text { font-family: 'BIZ UDゴシック', 'Meiryo', sans-serif; font-size: 11px; font-weight: bold; fill: #be123c; }
      .good-text { font-family: 'BIZ UDゴシック', 'Meiryo', sans-serif; font-size: 11px; font-weight: bold; fill: #047857; }
      .code-inline { font-family: 'Consolas', 'BIZ UDゴシック', monospace; font-size: 11px; fill: #1d4ed8; font-weight: bold; }
      .arrow-red { stroke: #e11d48; stroke-width: 2; fill: none; marker-end: url(#arrow-r); }
      .arrow-blue { stroke: #0284c7; stroke-width: 2; fill: none; marker-end: url(#arrow-b); }
      .vs-circle { fill: #334155; stroke: #ffffff; stroke-width: 2; }
      .vs-text { font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    </style>
    <marker id="arrow-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e11d48" />
    </marker>
    <marker id="arrow-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7" />
    </marker>
  </defs>

  <!-- 外枠背景 -->
  <rect class="bg" x="5" y="5" width="970" height="550" rx="12" />

  <!-- ヘッダーバー -->
  <rect class="header-bg" x="20" y="16" width="940" height="54" rx="10" />
  <text class="title" x="38" y="40">Module_ZipCode : インメモリ日本語住所解析・郵便番号検索エンジン (Excel VBA)</text>
  <text class="subtitle" x="38" y="59">外部Web API非依存（オフライン動作） × 6段階の正規化・最長一致・優先度スコアリングによる高精度特定</text>

  <!-- ==================== 左側: 従来の一般的なVBA実装 ==================== -->
  <rect class="legacy-panel" x="20" y="84" width="265" height="456" rx="10" />
  <rect class="legacy-header" x="20" y="84" width="265" height="32" rx="10" />
  <text class="panel-title" x="35" y="105">従来の一般的なVBA実装 (単純比較型)</text>

  <!-- Legacy Step 1 -->
  <rect class="legacy-card" x="36" y="132" width="233" height="52" rx="6" />
  <text class="card-title" x="48" y="152">1. KEN_ALL.csv 単純読込</text>
  <text class="card-text" x="48" y="170">・1行＝1レコードとしてそのまま格納</text>

  <line class="arrow-red" x1="152" y1="184" x2="152" y2="204" />

  <!-- Legacy Step 2 -->
  <rect class="legacy-card" x="36" y="208" width="233" height="52" rx="6" />
  <text class="card-title" x="48" y="228">2. 全件 For ループ走査 O(N)</text>
  <text class="card-text" x="48" y="246">・約12万件を毎回先頭から線形探索</text>

  <line class="arrow-red" x1="152" y1="260" x2="152" y2="280" />

  <!-- Legacy Step 3 -->
  <rect class="legacy-card" x="36" y="284" width="233" height="52" rx="6" />
  <text class="card-title" x="48" y="304">3. 単純な文字列前方一致</text>
  <text class="card-text" x="48" y="322">・InStr / Like による固定文字列比較</text>

  <line class="arrow-red" x1="152" y1="336" x2="152" y2="356" />

  <!-- Legacy 課題ボックス -->
  <rect x="36" y="360" width="233" height="164" rx="6" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.2" />
  <text class="warn-text" x="46" y="380">【実務データで発生する不一致・限界】</text>
  <text class="card-text" x="46" y="400">× 38文字超の複数行分割レコードが欠落</text>
  <text class="card-text" x="46" y="418">× 「十二丁目」「二十四軒」の漢数字不一致</text>
  <text class="card-text" x="46" y="436">× ハイフン削除で「1-2-3」が「123」に結合</text>
  <text class="card-text" x="46" y="454">× 「一番町」「大通西」「八丁堀」の文字消失</text>
  <text class="card-text" x="46" y="472">× 県省略・郡省略・京都市通り名で不一致</text>
  <text class="card-text" x="46" y="490">× 「（１～９丁目）」「（その他）」の判定不可</text>
  <text class="warn-text" x="46" y="512">→ 郵便番号の返却精度が大幅に低下</text>

  <!-- VS バッジ -->
  <circle class="vs-circle" cx="298" cy="310" r="16" />
  <text class="vs-text" x="298" y="315">VS</text>

  <!-- ==================== 右側: 本住所解析エンジン ==================== -->
  <rect class="engine-panel" x="312" y="84" width="648" height="456" rx="10" />
  <rect class="engine-header" x="312" y="84" width="648" height="32" rx="10" />
  <text class="panel-title" x="330" y="105">本モジュール : 6段階の住所解析・郵便番号検索エンジン (Module_ZipCode)</text>

  <!-- 左列 (Step 1 -> 2 -> 3) -->
  <!-- Engine Step 1 -->
  <rect class="engine-card" x="328" y="130" width="295" height="96" rx="8" />
  <rect x="328" y="130" width="295" height="22" rx="6" fill="#0284c7" />
  <text class="card-num" x="338" y="145">STEP 1 : CSV複数行分割レコードの自動結合</text>
  <text class="card-text" x="338" y="166">・KEN_ALL.csv特有の38文字超分割行を検知</text>
  <text class="card-text" x="338" y="184">・未閉鎖の開き括弧「（」を追跡し次行と自動連結</text>
  <text class="code-inline" x="338" y="202">→ 長大な丁目範囲や小字リストのデータ欠損を防止</text>
  <text class="card-text" x="338" y="218">・ADODB.Streamによる高速メモリ展開 (約12万件)</text>

  <line class="arrow-blue" x1="475" y1="226" x2="475" y2="246" />

  <!-- Engine Step 2 -->
  <rect class="engine-card" x="328" y="250" width="295" height="96" rx="8" />
  <rect x="328" y="250" width="295" height="22" rx="6" fill="#0284c7" />
  <text class="card-num" x="338" y="265">STEP 2 : 複合漢数字・表記ゆれの正規化</text>
  <text class="card-text" x="338" y="286">・十/百を含む漢数字を位取り計算で全角数字へ変換</text>
  <text class="card-text" x="338" y="304">  (例: 「十二」→「１２」、「二十四」→「２４」)</text>
  <text class="card-text" x="338" y="322">・ゆらぎ文字(ヶ/ヵ/が→ケ、之/の→ノ)と異体字統一</text>
  <text class="code-inline" x="338" y="338">→ ConvertKanjiNumerals / NormalizeAddress</text>

  <line class="arrow-blue" x1="475" y1="346" x2="475" y2="366" />

  <!-- Engine Step 3 -->
  <rect class="engine-card-highlight" x="328" y="370" width="295" height="96" rx="8" />
  <rect x="328" y="370" width="295" height="22" rx="6" fill="#1d4ed8" />
  <text class="card-num" x="338" y="385">STEP 3 : 区切り文字の保持 (数値結合バグ回避)</text>
  <text class="card-text" x="338" y="406">・検索前にハイフンや「丁目・番・丁・通」を消さない</text>
  <text class="card-text" x="338" y="424">・「赤坂1-2-3」が「赤坂123」に化ける現象を防止</text>
  <text class="card-text" x="338" y="442">・町名特定後に直後の第1数値(丁目)と第2数値を分離</text>
  <text class="code-inline" x="338" y="458">→ ExtractNumberFromSuffix で正確な番地抽出</text>

  <!-- Step 3 から Step 4 への連絡矢印 -->
  <path class="arrow-blue" d="M 623 418 L 636 418 L 636 178 L 645 178" />

  <!-- 右列 (Step 4 -> 5 -> 6) -->
  <!-- Engine Step 4 -->
  <rect class="engine-card-highlight" x="649" y="130" width="295" height="96" rx="8" />
  <rect x="649" y="130" width="295" height="22" rx="6" fill="#1d4ed8" />
  <text class="card-num" x="659" y="145">STEP 4 : 県・郡の省略補完と O(1) インデックス</text>
  <text class="card-text" x="659" y="166">・県省略時は pCityToPrefMap から都道府県を逆引き</text>
  <text class="card-text" x="659" y="184">・「郡ありキー」と「郡省略サブキー」の双方を登録</text>
  <text class="code-inline" x="659" y="202">・pSearchIndex("県+市区町村") → Collection(Idx)</text>
  <text class="card-text" x="659" y="218">・約12万件から対象市区町村の数十件へ O(1) で絞込</text>

  <line class="arrow-blue" x1="796" y1="226" x2="796" y2="246" />

  <!-- Engine Step 5 -->
  <rect class="engine-card" x="649" y="250" width="295" height="96" rx="8" />
  <rect x="649" y="250" width="295" height="22" rx="6" fill="#0284c7" />
  <text class="card-num" x="659" y="265">STEP 5 : 大字・字の境界処理と京都通り名対応</text>
  <text class="card-text" x="659" y="286">・先頭の「大字・小字・字」のみ除去したコア町名比較</text>
  <text class="card-text" x="659" y="304">  (町名内の「阿字ヶ浦」「一番町」等は破壊しない)</text>
  <text class="card-text" x="659" y="322">・京都市の「〇〇通△△上る/下る/東入/西入」を除去</text>
  <text class="code-inline" x="659" y="338">→ StripLeadingOazaAza / StripKyotoTorina</text>

  <line class="arrow-blue" x1="796" y1="346" x2="796" y2="366" />

  <!-- Engine Step 6 -->
  <rect class="engine-card-highlight" x="649" y="370" width="295" height="96" rx="8" />
  <rect x="649" y="370" width="295" height="22" rx="6" fill="#1d4ed8" />
  <text class="card-num" x="659" y="385">STEP 6 : 3段階優先度スコアリングと範囲判定</text>
  <text class="card-text" x="659" y="406">・最長一致した町名候補に対し括弧内の条件を評価</text>
  <text class="card-text" x="659" y="424">  [優先度3] 丁目/番地範囲(１～９、１、２等)・小字一致</text>
  <text class="card-text" x="659" y="440">  [優先度2] 範囲指定なしの標準町名 / [優先度1] その他</text>
  <text class="code-inline" x="659" y="458">→ 最長一致 × 最高優先度で単一または複数コードを特定</text>

  <!-- 下部: 最終出力バー -->
  <rect class="output-bar" x="328" y="478" width="616" height="48" rx="8" />
  <text class="good-text" x="342" y="498">【エンジン出力】 郵便番号 ＋ 正規化住所 ＋ マッチング判定根拠 ＋ 入力セルの一致部分赤色ハイライト (ColorMatchInCell)</text>
  <text class="card-text" x="342" y="516">・実務テストデータにおいて Web API との一致率 100% を達成し、判定根拠と一致文字範囲をセル上で可視化</text>
</svg>
